[workspace]
resolver = "3"
members = ["crates/ic-logging-storage", "crates/ic-metrics-storage", "crates/ic-storage"]
default-members = ["crates/ic-logging-storage", "crates/ic-metrics-storage", "crates/ic-storage"]
# Independent unpublished runtime qualification workspace.
exclude = ["qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
documentation = "https://docs.rs/ic-storage"
repository = "https://github.com/dragginzgame/ic-storage"
keywords = ["stable-memory", "storage", "collections", "canister", "icp"]
categories = ["wasm", "data-structures"]

[workspace.dependencies]
ic-storage = { path = "crates/ic-storage", version = "0.74.0" }
toko-tooling = "=0.43.0"

# External production dependencies.
ic-logging = { version = "0.25.1", default-features = false }
# Storage owns its codec; Metrics supplies instrumentation and canonical restoration.
ic-metrics = { version = "0.30.0", default-features = false }
thiserror = "2.0"

# External dependencies with mixed production/test usage; members select features.
ic-platform-runtime = { version = "0.22.0", default-features = false }
ic-wire = { version = "0.22.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }

# External tests/tooling only; Build/Host/Testkit and Clap are native-only.
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build = { version = "0.84.0", default-features = false }
ic-host-artifacts = { version = "0.77.0", default-features = false }
ic-host-fs = { version = "0.77.0", default-features = false }
ic-host-process = { version = "0.77.0", default-features = false }
serde_json = "1.0"
toml = "1.1.6"
trybuild = "1.0.121"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
wildcard_imports = "warn"
too_many_lines = "allow"

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
