[workspace]
resolver = "3"
members = ["crates/ic-logging-storage", "crates/ic-metrics-storage", "crates/ic-storage"]
default-members = ["crates/ic-logging-storage", "crates/ic-metrics-storage", "crates/ic-storage"]
# Independent unpublished runtime qualification workspace.
exclude = ["qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Durable stable-memory allocation governance for Internet Computer canisters"
readme = "crates/ic-storage/README.md"
documentation = "https://docs.rs/ic-storage"
homepage = "https://github.com/dragginzgame/ic-storage"
repository = "https://github.com/dragginzgame/ic-storage"
keywords = ["stable-memory", "storage", "collections", "canister", "icp"]
categories = ["wasm", "data-structures"]

[workspace.dependencies]
# storage
# Changelog : releases/storage/CHANGELOG.md
ic-storage = { path = "crates/ic-storage", version = "0.72.0" }
toko-tooling = "=0.38.2"

# metrics-storage
# Changelog : releases/metrics-storage/CHANGELOG.md
ic-metrics-storage = { path = "crates/ic-metrics-storage", version = "0.74.0" }

# logging-storage
# Changelog : releases/logging-storage/CHANGELOG.md
ic-logging-storage = { path = "crates/ic-logging-storage", version = "0.70.0" }

# External production dependencies.
ic-logging = { version = "0.24.0", default-features = false }
# Storage owns its codec; Metrics supplies instrumentation and canonical restoration.
ic-metrics = { version = "0.29.0", default-features = false }
thiserror = "2.0"

# External dependencies with mixed production/test usage; members select features.
ic-platform-runtime = { version = "0.21.0", default-features = false }
ic-wire = { version = "0.19.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }

# External tests/tooling only; Build/Host/Testkit and Clap are native-only.
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build = { version = "0.81.0", default-features = false }
ic-host-artifacts = { version = "0.76.1", default-features = false }
ic-host-fs = { version = "0.76.1", default-features = false }
ic-host-process = { version = "0.76.1", default-features = false }
serde_json = "1.0"
toml = "1.1.6"
trybuild = "1.0.121"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
