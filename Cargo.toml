[workspace]
members = ["crates/ic-storage", "crates/ic-storage-bench"]
default-members = ["crates/ic-storage"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/dragginzgame/ic-storage"
description = "Page-based stable-memory B-tree storage for Internet Computer applications"
license = "MIT"

[workspace.dependencies]
# Benchmark-only transport for init arguments and PocketIC requests/replies.
# The published ic-storage library has no direct or transitive Candid dependency;
# workspace entries select versions and do not add dependencies to every member.
candid = "0.10.38"
ic-cdk = "0.20.3"
# Native benchmark artifact identities, computed from the bytes installed.
ic-host-artifacts = "0.25"
ic-host-fs = "0.25"
ic-memory = "0.47"
ic-stable-structures = "0.7.2"
ic-storage = { path = "crates/ic-storage" }
ic-testkit = "0.51"
# Benchmark runner only: bounded Candid reply decoding.
ic-testkit-candid = "0.51"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
