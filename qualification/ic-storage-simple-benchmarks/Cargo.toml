[package]
name = "ic-storage-simple-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
autoexamples = false
autobenches = false

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.toko-tooling.loc]
category = "benchmarks"

[features]
stable-map = ["dep:ic-stable-structures"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["system-raw"] }
ic-stable-structures = { workspace = true, optional = true }

[[example]]
name = "stable-map-wasm"
path = "benches/stable_map.rs"
crate-type = ["cdylib"]
required-features = ["stable-map"]

[[example]]
name = "stable-matrix-wasm"
path = "benches/stable_matrix.rs"
crate-type = ["cdylib"]
required-features = ["stable-map"]

[lints]
workspace = true
