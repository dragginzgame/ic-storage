[package]
name = "ic-storage-retention-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
autotests = false

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[dependencies]
ic-host-artifacts.workspace = true
wasm-encoder = { workspace = true, features = ["std", "wasmparser"] }
wasmparser = { workspace = true, features = ["std", "validate", "features"] }
wat.workspace = true

[dev-dependencies]
ic-storage = { workspace = true, features = ["retained-build"] }
ic-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[[test]]
name = "retention"
path = "tests/retention_tests.rs"

[[test]]
name = "rust_startup"
path = "tests/rust_startup/mod.rs"

[[test]]
name = "checkpoint_provider"
path = "tests/checkpoint_provider/mod.rs"

[[test]]
name = "paged_store"
path = "tests/paged_store.rs"

[[test]]
name = "provider_link"
path = "tests/provider_link/mod.rs"

[[test]]
name = "ordered_native"
path = "tests/ordered_native/mod.rs"

[[test]]
name = "application_records"
path = "tests/application_records.rs"

[[test]]
name = "retained_runtime"
path = "tests/retained_runtime/mod.rs"
