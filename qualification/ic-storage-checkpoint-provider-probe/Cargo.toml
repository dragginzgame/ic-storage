[package]
name = "ic-storage-checkpoint-provider-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]
test = true
doctest = false

[features]
allocation-metrics = ["native-map-paged"]
native-bridge = []
native-map = ["native-bridge", "dep:ic-storage-native"]
native-map-job = ["native-map"]
native-map-paged = ["native-map-job"]
native-job = ["native-bridge"]
native-record = ["native-bridge"]
native-record-vector = ["native-bridge"]
native-record-vector-job = ["native-record-vector"]
native-record-vector-v2 = ["native-record-vector"]
native-record-vector-convert = ["native-record-vector"]
native-record-vector-source = ["native-record-vector"]
paged-store = ["dep:ic-storage-native"]
version-b = []

[dependencies]
ic-platform-runtime = { workspace = true, features = ["system-raw"] }
ic-storage-legacy.workspace = true
ic-storage-native = { workspace = true, features = ["map"], optional = true }
ic-storage-native-feasibility.workspace = true

[dev-dependencies]
ic-storage-legacy = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
