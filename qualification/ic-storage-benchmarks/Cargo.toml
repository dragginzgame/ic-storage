[package]
name = "ic-storage-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
autobenches = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
ic-storage = { workspace = true, features = ["test-support"], optional = true }
ic-testkit.workspace = true
serde_json.workspace = true
tokio.workspace = true

[package.metadata.toko-tooling.loc]
category = "benchmarks"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
metrics-checkpoints = ["owned", "dep:ic-metrics", "dep:ic-metrics-storage"]
returning-mutations = ["owned"]
owned = ["dep:ic-storage"]
dfinity = []
dfinity-governed = ["dfinity", "dep:ic-storage"]
dfinity-head = ["dep:ic-stable-structures-head"]
footprint = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["ic0"] }
ic-stable-structures-head = { workspace = true, optional = true }
ic-storage = { workspace = true, optional = true }

[dependencies]
ic-metrics = { workspace = true, optional = true }
ic-metrics-storage = { workspace = true, optional = true }
ic-stable-structures.workspace = true
ic-wire.workspace = true
ic_principal.workspace = true
serde.workspace = true
serde_bytes.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "storage-comparison-wasm"
path = "benches/wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "multi-allocations"
path = "benches/multi_allocations.rs"
required-features = ["owned", "dfinity"]

[[example]]
name = "collection-io"
path = "benches/collection_io.rs"
required-features = ["owned", "dfinity"]

[[example]]
name = "size-consumers"
path = "benches/size_consumer/runner.rs"

[[example]]
name = "admission-wasm"
path = "benches/admission_wasm/wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "admission"
path = "benches/admission.rs"

[[example]]
name = "metrics-checkpoints"
path = "benches/metrics_checkpoints/runner.rs"
required-features = ["metrics-checkpoints"]

[[example]]
name = "metrics-checkpoints-wasm"
path = "benches/metrics_checkpoints/wasm.rs"
crate-type = ["cdylib"]
required-features = ["metrics-checkpoints"]

[lints]
workspace = true
