[workspace]
resolver = "3"
members = [
    "ic-storage-checkpoint-provider-probe",
    "ic-storage-native-feasibility",
    "ic-storage-retention-probe",
    "ic-storage-rust-startup-probe",
    "ic-storage-simple-benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
ic-host-artifacts = "0.80.1"
ic-platform-runtime = { version = "0.23.12", default-features = false }
ic-storage = { path = "../crates/ic-storage" }
ic-storage-legacy = { package = "ic-storage", version = "0.74.1" }
ic-storage-native = { path = "../crates/ic-storage-native" }
ic-storage-native-feasibility = { path = "ic-storage-native-feasibility" }
ic-storage-retention-probe = { path = "ic-storage-retention-probe" }
ic-storage-simple-benchmarks = { path = "ic-storage-simple-benchmarks" }
ic-testkit = "0.107.1"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tokio = "1.54.1"
toko-tooling = "=0.44.9"
wasm-encoder = { version = "0.263.0", default-features = false }
wasmparser = { version = "0.263.0", default-features = false }
wat = { version = "~1.263.0", default-features = false }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
