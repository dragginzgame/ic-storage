[workspace]
resolver = "3"
members = ["storage-canister", "storage-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
ic-platform-runtime = { version = "0.23.17", default-features = false }
ic-storage = { path = "../crates/ic-storage" }
ic-testkit = "0.110.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
toko-tooling = "=0.45.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
