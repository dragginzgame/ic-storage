# Keep PocketIC's host-only dependency graph out of the library's normal gates.
[workspace]
resolver = "3"
members = [
    "ic-storage-benchmarks",
    "ic-storage-default-qualification",
    "ic-storage-platform-qualification",
    "ic-storage-runtime-qualification",
    "ic-storage-test-fixtures",
    "icss-size-consumer",
    "storage-size-consumer",
]
default-members = ["ic-storage-runtime-qualification"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-logging = { version = "0.24.0", default-features = false }
ic-logging-storage = { path = "../crates/ic-logging-storage", version = "0.69.0" }
# Platform supplies the composition fixture identity; Testkit owns the native client.
ic-platform = { version = "0.28.0", default-features = false }
ic-platform-runtime = { version = "0.21.0", default-features = false }
# Published reference engines, confined to this unpublished benchmark workspace.
ic-stable-structures = "0.7.2"
# Explicit research control for the maintainer-requested upstream comparison.
# The facade cannot select unpublished upstream code; no production consumer uses this.
ic-stable-structures-head = { package = "ic-stable-structures", git = "https://github.com/dfinity/stable-structures", rev = "b5d1650463f477affb3d358e86b1113953fc9937" }
ic-storage = { path = "../crates/ic-storage", version = "0.71.1" }
ic-storage-test-fixtures = { path = "ic-storage-test-fixtures" }
ic-testkit = { version = "0.95.0", default-features = false }
ic-wire = "0.19.0"
ic_principal = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }
toko-tooling = "=0.38.2"

[profile.comparison]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
