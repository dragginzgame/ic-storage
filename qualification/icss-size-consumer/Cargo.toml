[package]
name = "icss-size-consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[package.metadata.toko-tooling.loc]
category = "benchmarks"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib"]

[features]
discard-mutations = []
default = ["map", "set", "vector", "cell", "region"]
map = ["dep:ic-stable-structures"]
set = ["dep:ic-stable-structures"]
vector = ["dep:ic-stable-structures"]
cell = ["dep:ic-stable-structures"]
region = ["dep:ic-stable-structures"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["ic0"] }
ic-stable-structures = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true
