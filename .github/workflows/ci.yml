name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the exact tested change
        id: classify
        shell: bash
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: |
          if ! scope="$(perl scripts/ci/classify-ci-change.pl --event "$CHANGE_EVENT" --ref "$CHANGE_REF" \
            --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --policy ci/docs-only-paths.txt)"; then
            scope=full
          fi
          case "$scope" in docs|full) ;; *) scope=full ;; esac
          if [[ "$scope" == docs ]]; then
            git diff --check "$CHANGE_BASE...$CHANGE_HEAD" --
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  docs:
    needs: change-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check documentation and snapshot integrity
        run: make toko-tooling-check check-doc-links

  tooling-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # reviewed Shared Tooling pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make toko-tooling-check
      - uses: ./.github/actions/cache-tool-downloads
      - name: Install exact validation tools
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/ic-storage-tools"
          actionlint_bin="$(bash scripts/ci/install-ci-tool.sh actionlint --install-dir "$tool_dir")"
          shellcheck_bin="$(bash scripts/ci/install-ci-tool.sh shellcheck --install-dir "$tool_dir")"
          gitleaks_bin="$(bash scripts/ci/install-ci-tool.sh gitleaks --install-dir "$tool_dir")"
          {
            echo "GITLEAKS_BIN=$gitleaks_bin"
            echo "ACTIONLINT_BIN=$actionlint_bin"
            echo "SHELLCHECK_BIN=$shellcheck_bin"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan complete repository history
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'
      - run: make lint-tooling

  test:
    permissions:
      contents: read
      actions: read
    needs: [change-scope, docs]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Cold Intel setup plus the complete native gate exceeds thirty minutes.
    timeout-minutes: 60
    steps:
      - name: Require successful classification and documentation checks
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.change-scope.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          [[ "$CHANGE_RESULT" == success && "$DOCS_RESULT" == success ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # reviewed Shared Tooling pin
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read pinned Rust toolchain
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: pin
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Prepare retained fixture directory
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ic-storage-fixtures"
          echo "TMPDIR=$RUNNER_TEMP/ic-storage-fixtures" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # reviewed master-history commit
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: make toko-tooling-check
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
      - uses: ./.github/actions/cache-tool-downloads
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
      - name: Prepare host tools and identify common Cargo tool cache
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: common-tool-cache-key
        shell: bash
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/native-host-setup.log"
          make host-tools-check 2>&1 | tee "$RUNNER_TEMP/native-host-check.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/cargo-tool-cache-key.sh ci/tool-versions.env >> "$GITHUB_OUTPUT"
      - name: Restore common Cargo tool builds
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: common-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ${{ steps.common-tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.common-tool-cache-key.outputs.root }}/rust-*
          key: common-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.common-tool-cache-key.outputs.key }}-${{ hashFiles('ci/release-tools.env') }}
      - name: Install and verify selected common tools
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          make install-tools 2>&1 | tee "$RUNNER_TEMP/tools-setup.log"
          make tools-check 2>&1 | tee "$RUNNER_TEMP/tools-check.log"
          {
            echo "$PWD/.tools/host/bin"
            echo "$PWD/.tools/ic/bin"
            echo "$PWD/.tools/rust/common/bin"
          } >> "$GITHUB_PATH"
      - name: Save admitted common Cargo tools
        if: ${{ needs.change-scope.outputs.scope != 'docs' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.common-tool-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ${{ steps.common-tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.common-tool-cache-key.outputs.root }}/rust-*
          key: common-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.common-tool-cache-key.outputs.key }}-${{ hashFiles('ci/release-tools.env') }}
      - name: Prepare native ShellCheck
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          # Official v0.11.0 native assets; the shared default catalog is Linux-only.
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) checksum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Darwin:arm64) checksum=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
            Darwin:x86_64) checksum=3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6 ;;
            *) echo 'Unsupported native ShellCheck qualification host' >&2; exit 1 ;;
          esac
          SHELLCHECK_BIN="$(bash scripts/ci/install-ci-tool.sh shellcheck --version 0.11.0 --sha256 "$checksum" --install-dir "$RUNNER_TEMP/ic-storage-tools")"
          echo "SHELLCHECK_BIN=$SHELLCHECK_BIN" >> "$GITHUB_ENV"
      - uses: ./.github/actions/cache-tool-downloads
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          mode: save
      - name: Qualify exact-input ShellCheck reuse across release groups
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        run: make test-validation-stage-reuse 2>&1 | tee "$RUNNER_TEMP/stage-reuse.log"
      - name: Qualify native shared host, IC and Cargo reuse offline
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: make test-offline-tool-reuse
      - name: Prepare tracked dependency inputs
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          make fetch-dependencies 2>&1 | tee "$RUNNER_TEMP/dependencies.log"
          shasum -a 256 Cargo.lock
          rustc -Vv
          uname -sm
      - name: Qualify pinned toolchain and retain native failure-evidence archive
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: evidence
        shell: bash
        env:
          FAILURE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/ic-storage-fixtures/native-upload
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: make validate-ci 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Retain CI selection and stage evidence
        if: ${{ needs.change-scope.outputs.scope != 'docs' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-selection-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/ci-plans/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload native failure-evidence archive
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: evidence-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed Shared Tooling pin, v7.0.2
        with:
          name: native-failure-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Download verified native failure-evidence archive
        if: ${{ needs.change-scope.outputs.scope != 'docs' && (!cancelled() && steps.evidence-upload.outputs.artifact-id != '') }}
        id: evidence-download
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN: ${{ github.run_id }}
          EVIDENCE_ARTIFACT: ${{ steps.evidence-upload.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: bash scripts/ci/download-evidence.sh "$EVIDENCE_REPOSITORY" "$EVIDENCE_RUN" "$EVIDENCE_ARTIFACT" "$EVIDENCE_DIGEST" "$RUNNER_TEMP/ic-storage-evidence-downloaded"
      - name: Verify downloaded native failure evidence
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          bash scripts/ci/verify-failure-evidence.sh \
            "$RUNNER_TEMP/ic-storage-fixtures/native-upload" \
            "$RUNNER_TEMP/ic-storage-evidence-downloaded/evidence.tar.gz"
      - name: Archive failed validation and installer evidence
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure()) }}
        id: failure-evidence
        shell: bash
        env:
          EVIDENCE_TEMP_ROOT: ${{ runner.temp }}
          EVIDENCE_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          archive="$(bash scripts/ci/collect-failure-evidence.sh "$EVIDENCE_TEMP_ROOT" "$EVIDENCE_REPOSITORY_ROOT" compact)"
          if [[ -n "$archive" ]]; then
            printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain failed validation and installer evidence
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure() && steps.failure-evidence.outputs.path != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed Shared Tooling pin, v7.0.2
        with:
          name: validation-failure-${{ matrix.os }}
          path: ${{ steps.failure-evidence.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Report incomplete evidence after retention
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure() && steps.failure-evidence.outputs.collection-complete == 'false') }}
        shell: bash
        run: |
          echo 'Evidence collection was incomplete; inspect retained selection diagnostics.' >&2
          exit 1

      - name: Documentation-only result (native suites not run)
        if: ${{ needs.change-scope.outputs.scope == 'docs' }}
        run: echo 'Documentation checks passed; native qualification was not run.'

  runtime:
    needs: [change-scope, docs]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Require successful classification and documentation checks
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.change-scope.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          [[ "$CHANGE_RESULT" == success && "$DOCS_RESULT" == success ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # reviewed Shared Tooling pin
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          persist-credentials: false
      - name: Read pinned Rust toolchain
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: pin
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # reviewed master-history commit
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-unknown-unknown
      - run: make toko-tooling-check
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
      - uses: ./.github/actions/cache-tool-downloads
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
      - name: Prepare host tools and identify runtime tool cache
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: runtime-tool-cache-key
        shell: bash
        run: |
          make install-host-tools 2>&1 | tee "$RUNNER_TEMP/runtime-host-setup.log"
          make host-tools-check 2>&1 | tee "$RUNNER_TEMP/runtime-host-check.log"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/cargo-tool-cache-key.sh ci/tool-versions.env >> "$GITHUB_OUTPUT"
      - name: Restore runtime tool builds
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        id: runtime-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ${{ steps.runtime-tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.runtime-tool-cache-key.outputs.root }}/rust-*
            .tools/ic-testkit-server
          # Consumer pins select the CLI; shared installer identity owns build admission.
          key: runtime-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-tool-cache-key.outputs.key }}-${{ hashFiles('ci/runtime-tools.env', 'ci/ic-tools.tsv') }}
      - name: Prepare and verify selected CLI and Testkit server
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          make install-ic-tools 2>&1 | tee "$RUNNER_TEMP/runtime-ic-setup.log"
          make ic-tools-check 2>&1 | tee "$RUNNER_TEMP/runtime-ic-check.log"
          make install-runtime-server 2>&1 | tee "$RUNNER_TEMP/runtime-setup.log"
          make runtime-server-check 2>&1 | tee "$RUNNER_TEMP/runtime-tools-check.log"
      - name: Save admitted runtime tools
        if: ${{ needs.change-scope.outputs.scope != 'docs' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.runtime-tool-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ${{ steps.runtime-tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.runtime-tool-cache-key.outputs.root }}/rust-*
            .tools/ic-testkit-server
          key: runtime-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-tool-cache-key.outputs.key }}-${{ hashFiles('ci/runtime-tools.env', 'ci/ic-tools.tsv') }}
      - uses: ./.github/actions/cache-tool-downloads
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        with:
          mode: save
      - name: Prepare both tracked dependency graphs
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: |
          make fetch-dependencies
          cargo fetch --locked --manifest-path qualification/Cargo.toml
          shasum -a 256 Cargo.lock qualification/Cargo.lock
          rustc -Vv
          uname -sm
      - name: Admit both destination graphs before artifact qualification
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        run: make check-dependency-adoption
      - name: Check the independent compiler and documentation contracts
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        run: make check-qualification-lints check-qualification-docs
      - name: Qualify original and optimized Wasm, installed IO and upgrade rollback
        if: ${{ needs.change-scope.outputs.scope != 'docs' }}
        shell: bash
        run: make test-runtime 2>&1 | tee "$RUNNER_TEMP/runtime.log"
      - name: Archive failed runtime qualification
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure()) }}
        id: failure-evidence
        shell: bash
        run: |
          archive="$(bash scripts/ci/collect-failure-evidence.sh "$RUNNER_TEMP" "$PWD" compact)"
          if [[ -n "$archive" ]]; then
            printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain failed runtime qualification
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure() && steps.failure-evidence.outputs.path != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reviewed Shared Tooling pin, v7.0.2
        with:
          name: runtime-failure-${{ matrix.os }}
          path: ${{ steps.failure-evidence.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Report incomplete evidence after retention
        if: ${{ needs.change-scope.outputs.scope != 'docs' && needs.change-scope.result == 'success' && needs.docs.result == 'success' && (failure() && steps.failure-evidence.outputs.collection-complete == 'false') }}
        shell: bash
        run: |
          echo 'Evidence collection was incomplete; inspect retained selection diagnostics.' >&2
          exit 1

      - name: Documentation-only result (native suites not run)
        if: ${{ needs.change-scope.outputs.scope == 'docs' }}
        run: echo 'Documentation checks passed; native qualification was not run.'
