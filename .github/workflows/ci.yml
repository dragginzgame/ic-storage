name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    env:
      TOKO_TOOLING_STORE: ${{ github.workspace }}/target/ci-tool-store
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare host parsers and pinned compiler
        run: |
          bash scripts/ci/setup-step.sh compiler bash -e -o pipefail <<'SETUP'
          make install-host-tools
          make host-tools-check
          export PATH="$PWD/.tools/host/bin:$PATH"
          bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
          SETUP
      - name: Prepare and admit common tools
        run: bash scripts/ci/setup-step.sh common-tools bash vendor/toko-tooling/scripts/ci/prepare-common-tools.sh
      - name: Prepare locked dependencies
        run: |
          bash scripts/ci/setup-step.sh dependencies bash -e -o pipefail <<'SETUP'
          cargo fetch --locked
          cargo fetch --manifest-path qualification/Cargo.toml --locked
          SETUP
      - name: Validate storage library
        run: make ci
      - name: Prepare installed-test server
        run: bash scripts/ci/setup-step.sh storage-server make storage-setup
      - name: Qualify stable collection upgrades and rollback
        run: |
          mkdir -p target/evidence
          make storage-installed-test 2>&1 | tee target/evidence/storage-installed-test.log
      - name: Collect bounded sanitized diagnostics
        id: collect
        if: failure()
        run: perl scripts/ci/diagnostics.pl collect "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TOKO_TOOLING_STORE" target/ci-diagnostics
      - name: Retain sanitized diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.os }}
          path: target/ci-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Report diagnostic retention
        if: failure()
        env:
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
          COLLECTION: ${{ steps.collect.outcome }}
          UPLOAD: ${{ steps.diagnostics.outcome }}
        run: |
          printf 'Diagnostics collection=%s upload=%s\n' "$COLLECTION" "$UPLOAD" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf '[Sanitized diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Diagnostic artifact unavailable; inspect the failed collection/upload step.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  security-and-workflow:
    env:
      TOKO_TOOLING_STORE: ${{ github.workspace }}/target/ci-tool-store
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and run pinned validators
        run: |
          bash scripts/ci/tests/diagnostics.sh
          bash scripts/ci/tests/cargo-network.sh
          bash scripts/ci/setup-step.sh validators bash -e -o pipefail <<'SETUP'
          tool_dir="$RUNNER_TEMP/ci-tools"
          actionlint_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh actionlint --install-dir "$tool_dir")"
          gitleaks_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks --install-dir "$tool_dir")"
          "$actionlint_bin" .github/workflows/ci.yml
          "$gitleaks_bin" git --redact=100 --no-banner --no-color --log-level warn "$GITHUB_WORKSPACE"
          SETUP
      - name: Collect bounded sanitized diagnostics
        id: collect
        if: failure()
        run: perl scripts/ci/diagnostics.pl collect "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TOKO_TOOLING_STORE" target/ci-diagnostics
      - name: Retain sanitized diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-security-and-workflow
          path: target/ci-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Report diagnostic retention
        if: failure()
        env:
          ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
          COLLECTION: ${{ steps.collect.outcome }}
          UPLOAD: ${{ steps.diagnostics.outcome }}
        run: |
          printf 'Diagnostics collection=%s upload=%s\n' "$COLLECTION" "$UPLOAD" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf '[Sanitized diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Diagnostic artifact unavailable; inspect the failed collection/upload step.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
