# Keep PocketIC's host-only dependency graph out of the library's normal gates.
[workspace]
resolver = "3"
members = [
    "crates/ic-storage-benchmarks",
    "crates/ic-storage-default-qualification",
    "crates/ic-storage-platform-qualification",
    "crates/ic-storage-runtime-qualification",
    "crates/ic-storage-test-fixtures",
]
default-members = ["crates/ic-storage-runtime-qualification"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-logging = { version = "0.24.0", default-features = false }
ic-logging-storage = { path = "../../crates/ic-logging-storage", version = "0.66.0" }
# Facade for the native client and composition fixture's Principal identity.
# Testkit retains server selection and lifecycle.
ic-platform = { version = "0.19.0", default-features = false }
ic-platform-runtime = { version = "0.20.0", default-features = false }
# Platform 0.18 removed the upstream collection facade. Keep it solely for
# the unpublished DFINITY comparison; production and native clients use 0.19.
ic-platform-stable-benchmark = { package = "ic-platform", version = "0.17.0", default-features = false }
# Explicit research control for the maintainer-requested upstream comparison.
# The facade cannot select unpublished upstream code; no production consumer uses this.
ic-stable-structures-head = { package = "ic-stable-structures", git = "https://github.com/dfinity/stable-structures", rev = "b5d1650463f477affb3d358e86b1113953fc9937" }
ic-storage = { path = "../../crates/ic-storage", version = "0.68.9" }
ic-storage-test-fixtures = { path = "crates/ic-storage-test-fixtures" }
ic-wire = "0.17.0"
ic_principal = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"

[profile.comparison]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
