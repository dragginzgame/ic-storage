[package]
name = "ic-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
description = "Named stable-memory allocations and governed upstream stable collections"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
test-support = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["system-raw"] }

[dependencies]
ic-stable-structures.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true
