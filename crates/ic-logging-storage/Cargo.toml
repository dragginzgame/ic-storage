[package]
name = "ic-logging-storage"
edition.workspace = true
rust-version.workspace = true
version = "0.70.0"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Optional governed stable checkpoints for IC Logging"
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-logging.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
ic-storage = { workspace = true, features = ["test-support"] }
toko-tooling.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
