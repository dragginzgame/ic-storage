[package]
name = "ic-metrics-storage"
edition.workspace = true
rust-version.workspace = true
version = "0.77.0"
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Optional single-map stable storage for IC Metrics"
readme = "README.md"
publish = ["crates-io"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-metrics.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Native backing support, excluded from the production feature set.
ic-storage = { workspace = true, features = ["test-support"] }
toko-tooling.workspace = true

[lints]
workspace = true
